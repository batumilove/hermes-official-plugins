name: Telemetry receipt interoperability

on:
  pull_request:
    paths:
      - langfuse/**
      - .github/workflows/telemetry-receipts.yml
  push:
    branches: [main]
    paths:
      - langfuse/**
      - .github/workflows/telemetry-receipts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-receipts:
    name: Exact core and plugin receipt contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CORE_SHA: d5212091d0f698d90c1eb96e96faa7bc049876c0
      PLUGIN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the pinned merged core
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: batumilove/hermes-agent
          ref: ${{ env.CORE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact plugin head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.PLUGIN_SHA }}
          path: paired-plugin
          persist-credentials: false
      - name: Verify both source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CORE_SHA"
          test "$(git -C paired-plugin rev-parse HEAD)" = "$PLUGIN_SHA"
          printf 'Core: `%s`\nPlugin: `%s`\nOffline Linux contracts, not live delivery acceptance.\n' "$CORE_SHA" "$PLUGIN_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the locked core test environment
        uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          test-environment: 'true'
          cache: 'false'
          cache-python: 'false'
          save-tools-cache: 'false'
          save-python-cache: 'false'
      - name: Verify the core's pinned imported release
        shell: bash
        run: |
          set -euo pipefail
          "$HERMES_PYTHON" - <<'PY'
          import os, subprocess
          from pathlib import Path
          from hermes_cli.version_provenance import IMPORTED_RELEASE
          from hermes_cli.version_info import get_version_info
          from scripts.check_fork_delta import DEFAULT_MANIFEST, fetch_provenance_source
          from hermes_cli.plugins_turn_boundary import turn_boundary
          from hermes_cli.plugins_turn_evidence_collector import TurnEvidenceCollector, TransferVerifier
          assert callable(turn_boundary) and callable(TurnEvidenceCollector) and callable(TransferVerifier)
          version, tag_object, release_commit = IMPORTED_RELEASE
          ref = "refs/tags/v" + version
          subprocess.run(["git", "fetch", "--no-tags",
                          "https://github.com/NousResearch/hermes-agent.git", ref + ":" + ref], check=True)
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          assert git("rev-parse", ref) == tag_object
          assert git("rev-parse", ref + "^{commit}") == release_commit
          fetch_provenance_source(DEFAULT_MANIFEST, cwd=Path.cwd())
          info = get_version_info()
          assert info.commit == os.environ["CORE_SHA"] and info.base_version == version
          PY
      - name: Run all Langfuse and core custody contracts without credentials
        shell: bash
        env:
          HERMES_TEST_WORKERS: '2'
          HERMES_TEST_FILE_RETRIES: '0'
        run: |
          set -euo pipefail
          scripts/run_tests.sh \
            "$GITHUB_WORKSPACE/paired-plugin/langfuse/tests" \
            tests/hermes_cli/test_turn_evidence_collector.py \
            tests/hermes_cli/test_plugin_turn_boundary.py \
            tests/hermes_cli/test_plugin_turn_boundary_async.py \
            tests/agent/test_plugin_stream_evidence.py \
            tests/agent/test_turn_evidence_boundary.py \
            --file-timeout 120
      - name: Produce verified core build identity
        shell: bash
        run: |
          set -euo pipefail
          "$HERMES_PYTHON" - <<'PYCODE'
          import dataclasses, hashlib, json, os, subprocess, sys
          from pathlib import Path
          from hermes_cli.version_info import get_version_info
          from hermes_cli.version_provenance import IMPORTED_RELEASE
          from scripts.write_install_stamp import build_stamp
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          info = get_version_info()
          assert info.commit == os.environ["CORE_SHA"] == git("rev-parse", "HEAD")
          assert info.base_version == IMPORTED_RELEASE[0] and not info.dirty
          assert not git("status", "--porcelain", "--untracked-files=no")
          assert git("-C", "paired-plugin", "rev-parse", "HEAD") == os.environ["PLUGIN_SHA"]
          output = Path(os.environ["RUNNER_TEMP"]) / "telemetry-core-identity"
          output.mkdir(mode=0o700)
          stamp = build_stamp(update_mechanism="external", commit=info.commit,
              branch=info.branch or "", dirty=False, base_version=info.base_version,
              display_version=info.derived_version, distance=info.distance,
              commit_date=info.commit_date, source="ci")
          encoded = (json.dumps(stamp, sort_keys=True, indent=2) + "\n").encode()
          (output / "install-stamp.json").write_bytes(encoded)
          identity = {"schema": 1, "core_commit": info.commit,
              "core_tree": git("rev-parse", "HEAD^{tree}"),
              "plugin_commit": os.environ["PLUGIN_SHA"],
              "plugin_tree": git("-C", "paired-plugin", "rev-parse", "HEAD^{tree}"),
              "python": sys.version, "version_info": dataclasses.asdict(info),
              "stamp_sha256": hashlib.sha256(encoded).hexdigest(),
              "core_inputs": {name: hashlib.sha256(Path(name).read_bytes()).hexdigest()
                              for name in ("pyproject.toml", "uv.lock")},
              "test_gate": "prior exact-core canonical test step succeeded",
              "scope": "build identity only; no runtime or delivery acceptance"}
          (output / "identity.json").write_text(json.dumps(identity, indent=2) + "\n")
          PYCODE
      - name: Publish verified core build identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: telemetry-core-identity-${{ env.CORE_SHA }}-${{ env.PLUGIN_SHA }}
          path: ${{ runner.temp }}/telemetry-core-identity/
          if-no-files-found: error
          retention-days: 1
